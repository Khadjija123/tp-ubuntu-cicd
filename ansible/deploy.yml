---
- name: Déploiement du site web dans un conteneur Docker
  hosts: webservers
  vars:
    app_dir: "/home/{{ ansible_user }}/app"
    image_name: mon-site
    container_name: mon-site

  tasks:
    - name: Créer le dossier de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copier le Dockerfile
      ansible.builtin.copy:
        src: ../Dockerfile
        dest: "{{ app_dir }}/Dockerfile"

    - name: Copier les fichiers du site
      ansible.builtin.copy:
        src: ../site/
        dest: "{{ app_dir }}/site/"

    - name: Construire l'image Docker
      ansible.builtin.command: docker build -t {{ image_name }} .
      args:
        chdir: "{{ app_dir }}"

    - name: Supprimer l'ancien conteneur s'il existe
      ansible.builtin.command: docker rm -f {{ container_name }}
      failed_when: false
      changed_when: false

    - name: Lancer le nouveau conteneur sur le port 80
      ansible.builtin.command: >
        docker run -d --name {{ container_name }}
        --restart unless-stopped -p 80:80 {{ image_name }}

    - name: Vérifier que le site répond
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
        return_content: false
      retries: 5
      delay: 2
      register: result
      until: result.status == 200
